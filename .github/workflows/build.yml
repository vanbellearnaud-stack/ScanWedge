name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      # Le contexte `secrets` est interdit dans un `if:` de step → on l'expose via
      # un output, puis on conditionne sur `steps.sign.outputs.enabled`.
      - name: Détecter la signature release
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Décoder le keystore
        if: steps.sign.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/robotscan.jks"

      - name: Build release (signé)
        if: steps.sign.outputs.enabled == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/robotscan.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build debug (signature non encore configurée)
        if: steps.sign.outputs.enabled != 'true'
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Localiser l'APK produit
        id: apk
        env:
          SIGNED: ${{ steps.sign.outputs.enabled }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            echo "path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: robotscan-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Publie l'APK dans une Release "latest" → URL permanente (QR d'install).
      - name: Publish APK to Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Dernier APK
          files: ${{ steps.apk.outputs.path }}
